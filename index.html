<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CI Imaging Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail with station status, one scrolling work area; the rail collapses to an icon bar on phones. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --soft:#f7f9fc; --ink:#0e1a2c; --ink2:#4a596f; --ink3:#76859a;
  --line:#e2e8f1; --grid:#e7ebf2; --blue:#1565b4; --blue-ink:#1565b4; --blue-soft:#e7f0fb; --orange:#f58a1c;
  --navy:#0f2744; --navy2:#16355c; --btn:#1565b4; --ok:#2f8a3c; --ok-soft:#e5f3e7; --warn-soft:#fdeede;
  --c0:#3a8f3f; --c1:#d9a21c; --c2:#f28a24; --c3:#b8291e; --median:#0e1a2c; --bound:#eeb27a;
  --pill-ink:#fff; --c1-ink:#3a2a00; --shadow:0 1px 2px rgba(14,26,44,.05),0 4px 14px rgba(14,26,44,.04);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a111e; --surface:#111b2d; --soft:#0e1727; --ink:#e8edf5; --ink2:#a6b3c6; --ink3:#7d8ba1;
  --line:#22304a; --grid:#1c2940; --blue-ink:#6fb1f2; --blue-soft:#12304f; --ok:#58b563; --ok-soft:#14301b; --warn-soft:#3a2713;
  --c0:#4cae52; --c1:#e2b030; --c2:#f59a40; --c3:#d9483b; --median:#e8edf5; --bound:#a8703a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111e; --surface:#111b2d; --soft:#0e1727; --ink:#e8edf5; --ink2:#a6b3c6; --ink3:#7d8ba1;
  --line:#22304a; --grid:#1c2940; --blue-ink:#6fb1f2; --blue-soft:#12304f; --ok:#58b563; --ok-soft:#14301b; --warn-soft:#3a2713;
  --c0:#4cae52; --c1:#e2b030; --c2:#f59a40; --c3:#d9483b; --median:#e8edf5; --bound:#a8703a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:16px}
.logo{display:block;width:210px;max-width:100%;margin:2px 4px 6px;height:auto}
:root[data-theme="dark"] .logo,:root[data-theme="dark"] .tb-logo{background:#fff;border-radius:8px;padding:6px 8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo,:root:not([data-theme="light"]) .tb-logo{background:#fff;border-radius:8px;padding:6px 8px}}
.station{border:1px solid var(--line);background:var(--blue-soft);border-radius:12px;padding:11px 13px}
.eyebrow{font:700 11px/1.2 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-ink)}
.station b{display:block;font-size:16px;margin-top:5px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:500;color:var(--ink2);text-align:left}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.sys{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.sys h4{margin:0 0 8px;font:700 11px/1 var(--font);letter-spacing:.14em;color:var(--blue-ink);text-transform:uppercase}
.sys div{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.demo-note{font-size:12px;color:var(--ink3);line-height:1.45;padding:0 4px}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink2);align-self:flex-start}
.topbar{display:none}
.main{min-width:0;padding:28px max(32px,env(safe-area-inset-right,0px)) 90px 32px;max-width:1320px;width:100%}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 22%,transparent);color:var(--ink);border-radius:12px;padding:11px 14px;margin-bottom:20px;font-size:13px}
.banner svg{flex:none;margin-top:2px;color:var(--blue-ink)}
.banner a{color:var(--blue-ink);font-weight:600;cursor:pointer;white-space:nowrap}
h1{font:800 34px/1.1 var(--font);letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h2{font:700 16px/1.25 var(--font);margin:0 0 4px;letter-spacing:-.005em}
h3{font:700 15px/1.3 var(--font);margin:0}
p{margin:0}
.lede{max-width:70ch;color:var(--ink2);font-size:16px;line-height:1.6}
.sec{font:700 12px/1 var(--font);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:30px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.muted{color:var(--ink2)}
.small{font-size:13px;color:var(--ink2)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.stat .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico.b{background:var(--blue-soft);color:var(--blue-ink)} .ico.o{background:var(--warn-soft);color:var(--orange)} .ico.g{background:var(--ok-soft);color:var(--ok)} .ico.n{background:var(--soft);color:var(--ink2)}
.stat .k{font-size:14px;color:var(--ink2)} .stat .v{font:800 30px/1.15 var(--font);letter-spacing:-.02em;margin:2px 0} .stat .s{font-size:13px;color:var(--ink2)}
.bar{height:6px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--orange);border-radius:4px}
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;background:var(--navy);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.9fr);gap:28px;padding:56px 48px 54px;margin-bottom:20px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:var(--hero) center/cover;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,30,58,.93),rgba(14,38,70,.82) 55%,rgba(20,50,60,.74));z-index:-1}
.hero .strip{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#1565b4 0 52%,#f58a1c 52% 82%,#2f8a3c 82%)}
.hero .eyebrow{color:#dbe7f7;letter-spacing:.12em}
.hero h1{font-size:clamp(34px,4.6vw,60px);line-height:1.04;margin:22px 0 18px}
.hero p{color:#e3ebf6;font-size:18px;max-width:34em;line-height:1.55}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:10px;border:1px solid transparent;padding:11px 18px;font-weight:600;font-size:15px;background:var(--btn);color:#fff}
.btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.or{background:var(--orange);color:#fff}
.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.stop{background:var(--surface);border-color:color-mix(in srgb,#d63b2f 45%,var(--line));color:#d63b2f}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.ready{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:22px 24px;align-self:start}
.ready .top{display:flex;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:8px}
.ready .tick{width:44px;height:44px;border-radius:11px;background:#2f8a3c;display:grid;place-items:center}
.ready .top .eyebrow{display:block;font-size:11.5px}.ready .top b{font-size:19px}
.ready ul{list-style:none;margin:0;padding:0}
.ready li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.ready li span:first-child{display:flex;gap:11px;align-items:center}
.ready li b{font-weight:600}
.ready .dot{box-shadow:none}
.cols2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-top:18px}
.recent{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rrow img,.thumb{width:70px;height:40px;object-fit:cover;border-radius:7px;background:#0d1a2a;display:block}
.rrow .id{font:600 14px var(--mono)}.rrow .sub{font-size:12.5px;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font:600 12.5px/1.4 var(--font);color:var(--pill-ink);white-space:nowrap}
.pill.p0{background:var(--c0)}.pill.p1{background:var(--c1);color:var(--c1-ink)}.pill.p2{background:var(--c2)}.pill.p3{background:var(--c3)}.pill.pn{background:var(--grid);color:var(--ink2)}
.ago{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.balrow{display:grid;grid-template-columns:90px minmax(0,1fr) 34px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.balrow .l{display:flex;gap:9px;align-items:center}.balrow .tr{height:9px;border-radius:5px;background:var(--grid);overflow:hidden}.balrow .tr i{display:block;height:100%;border-radius:5px}
.balrow b{text-align:right}
.dotc{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.stepc{position:relative;border-radius:18px;overflow:hidden;color:#fff;padding:26px 24px 22px;min-height:210px;display:flex;flex-direction:column;gap:8px;isolation:isolate;text-align:left;border:0}
.stepc::before{content:"";position:absolute;inset:0;background:var(--bgimg) center/cover;z-index:-2}
.stepc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,30,56,.62),rgba(11,30,56,.9));z-index:-1}
.stepc .n{width:30px;height:30px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:700;font-size:14px}
.stepc h3{font-size:20px;margin-top:6px}.stepc p{color:#dbe5f2;font-size:14.5px;line-height:1.5;flex:1}
.stepc .go{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:6px}
/* capture */
.capgrid{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:20px;align-items:start}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);justify-content:flex-end;align-items:center;margin-top:-6px}
kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface);color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:14px}
.next{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(245,138,28,.5),transparent 68%)}
.next .eyebrow{color:#b9cde6;font-size:10.5px}.next b{display:block;font:600 24px var(--mono);margin:6px 0 4px}.next span.s{font-size:13px;color:#c8d7ea}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field small{font-weight:400;color:var(--ink3)}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;width:100%;min-width:0;font-weight:400;font-size:14px}
select{appearance:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,26,44,.12)}
.tog{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.tog .sw{flex:none;width:38px;height:22px;border-radius:11px;background:var(--grid);position:relative;border:0;transition:background .15s}
.tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog .sw[aria-checked="true"]{background:var(--btn)}.tog .sw[aria-checked="true"]::after{transform:translateX(16px)}
.tog b{font-size:14px;display:block}.tog span.s{font-size:12.5px;color:var(--ink3);display:block;line-height:1.4}
.clsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clsb{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;font-weight:600;font-size:14px;text-align:left}
.clsb .k{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink3)}
.clsb[aria-pressed="true"]{color:#fff;border-color:transparent}
.clsb[aria-pressed="true"] .dotc{background:#fff!important}
.clsb[aria-pressed="true"][data-c="0"]{background:var(--c0)}.clsb[aria-pressed="true"][data-c="1"]{background:var(--c1);color:var(--c1-ink)}.clsb[aria-pressed="true"][data-c="2"]{background:var(--c2)}.clsb[aria-pressed="true"][data-c="3"]{background:var(--c3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.live{position:relative;aspect-ratio:16/8.5;background:#09121e;border-radius:14px 14px 0 0;overflow:hidden;color:#fff}
.live img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,28,.55),rgba(8,16,28,0) 32%,rgba(8,16,28,0) 55%,rgba(8,16,28,.82))}
.badge{position:absolute;left:14px;top:14px;display:flex;gap:8px;align-items:center;background:rgba(8,16,28,.6);border-radius:99px;padding:4px 12px 4px 10px;font:700 11px/1.6 var(--font);letter-spacing:.1em;backdrop-filter:blur(6px)}
.badge i{width:8px;height:8px;border-radius:50%;background:#37c24a}.badge.rec i{background:#ff4b3e;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.badge.rec i{animation:none}}
.station-tag{position:absolute;right:14px;top:14px;font:700 11px/1.6 var(--font);letter-spacing:.1em;background:rgba(8,16,28,.6);border-radius:99px;padding:4px 12px}
.live .cap{position:absolute;left:18px;right:18px;bottom:14px}
.live .cap b{font-size:15px;display:block}.live .cap span{font-size:13px;color:#cdd9e8}
.live .cap .mono{font-size:20px;font-weight:600}
.prog{display:flex;align-items:center;gap:12px;margin-top:10px;font:600 13px var(--mono)}.prog .tr{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}.prog .tr i{display:block;height:100%;background:var(--orange)}
.readout{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--surface)}
.readout div{padding:12px 16px;border-right:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.readout div:last-child{border-right:0}.readout b{display:block;font:700 22px var(--font);color:var(--ink);margin-top:3px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.frames img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;display:block}
.stopped{margin-top:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--orange) 35%,transparent);color:#b4570b;border-radius:9px;padding:9px 12px;font-size:13px}
:root[data-theme="dark"] .stopped{color:#f3b27a}
/* batches */
.bcards{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px}
.bcard{flex:0 0 280px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.bcard[aria-pressed="true"]{border:2px solid var(--blue);padding:13px 15px}
.bcard .t{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}.bcard .t span{font:400 12.5px var(--font);color:var(--ink3)}
.bcard .m{font-size:13px;color:var(--ink2)}.bcard .n{font-size:13px;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:#e8edf5;color:#0e1a2c}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--ink3);flex:1;min-width:0}
.search input{border:0;background:none;padding:10px 0;outline:0;min-width:0;flex:1}
.search:focus-within{outline:2px solid var(--blue-ink);outline-offset:1px}
.tablewrap{overflow:auto;max-height:560px;border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font:600 13px var(--font);color:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th.r,td.r{text-align:right}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--soft)}
td .mono{font-weight:500;font-size:13.5px}
.fx{display:flex;gap:14px;align-items:center}
/* charts */
.chartcard{padding:22px 22px 14px}
.chartcard svg{display:block;width:100%;overflow:visible}
.ax{fill:var(--ink3);font:12px var(--font)} .axl{fill:var(--ink2);font:600 12.5px var(--font)} .axs{fill:var(--ink3);font:11.5px var(--font)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 6px;font-size:13.5px}
.legend span{display:inline-flex;gap:7px;align-items:center}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;width:18px;border-radius:2px}
.gd{stroke:var(--grid);stroke-width:1}
.pt{stroke:var(--surface);stroke-width:1.6;cursor:pointer}.pt:hover{stroke:var(--ink);stroke-width:2}
.bar-r{cursor:pointer}.bar-r:hover{opacity:.75}
.fc0{fill:var(--c0)}.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fA{fill:#1f65b3}.fB{fill:var(--c2)}.fC{fill:var(--c0)}
:root[data-theme="dark"] .fA{fill:#4a93de}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fA{fill:#4a93de}}
.tip{position:fixed;z-index:80;pointer-events:none;background:#0f1b2d;color:#fff;border-radius:9px;padding:9px 13px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:280px;opacity:0;transition:opacity .08s}
.tip b{font:600 12.5px var(--mono);color:#f6b46c;display:block}.tip.on{opacity:1}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,16,30,.55);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:61;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;justify-content:space-between;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.dh .id{font:600 22px var(--mono);margin-top:5px;word-break:break-all}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.meta{display:grid;grid-template-columns:repeat(2,1fr);border-bottom:1px solid var(--line)}
.meta div{padding:12px 22px;border-right:1px solid var(--line);font-size:13px;color:var(--ink2)}.meta div:nth-child(2n){border-right:0}.meta div:nth-child(n+3){border-top:1px solid var(--line)}
.meta b{display:block;font:700 18px var(--font);color:var(--ink);margin-top:2px}
.db{flex:1;overflow:auto;padding:6px 22px 30px}
.db h4{font:700 11.5px var(--font);letter-spacing:.13em;color:var(--ink3);margin:20px 0 10px;text-transform:uppercase}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph button{border:0;padding:0;background:#0b1522;border-radius:8px;overflow:hidden;display:block}.ph img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ph button:hover{outline:2px solid var(--orange)}
.nophoto{margin-top:18px;border:1px dashed var(--line);border-radius:12px;padding:18px;background:var(--soft);color:var(--ink2);font-size:13.5px;line-height:1.55}
.lb{position:fixed;inset:0;z-index:90;background:rgba(6,12,22,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
.lb img{max-width:min(1100px,100%);max-height:76vh;border-radius:10px;display:block}
.lb .cap{font:500 12.5px var(--mono);color:#d4dfee;text-align:center}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.lb .nv.l{left:max(12px,env(safe-area-inset-left,0px))}.lb .nv.r{right:max(12px,env(safe-area-inset-right,0px))}
.lb .cl{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.dlg{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(8,16,30,.6);padding:16px}
.dlg .box{background:var(--surface);border-radius:16px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;padding:22px;gap:12px;border:1px solid var(--line)}
.dlg textarea{flex:1;min-height:240px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:12px;font:12.5px/1.5 var(--mono);resize:none;width:100%}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#0f1b2d;color:#fff;border-radius:10px;padding:11px 18px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:99;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.rigcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.stepn{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:700;flex:none}
.rig-h{display:flex;gap:14px;align-items:flex-start}.rig-h h3{font-size:18px}
.status{margin-left:auto;font:600 12.5px var(--font);border-radius:99px;padding:4px 12px;background:var(--ok-soft);color:var(--ok);white-space:nowrap;align-self:flex-start}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.plates img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}.plates small{display:block;margin-top:5px;color:var(--ink3);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin-top:14px}.kv small{color:var(--ink3);display:block}.kv b{font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.val td:nth-child(2){font:700 16px var(--font);white-space:nowrap}.val td:nth-child(3){color:var(--ink2)}
.callout{display:flex;gap:12px;align-items:center;background:var(--blue-soft);color:var(--ink);border-radius:10px;padding:12px 16px;margin:18px 0 6px;font-size:14px}
.callout svg{color:var(--blue-ink);flex:none}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr;padding:40px 30px}.cols2,.capgrid,.rigcols{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{display:block}.side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;gap:6px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
  .tb-logo{height:30px;width:auto;flex:none}
  .tb-nav{display:flex;gap:2px}.tb-nav button{border:0;background:none;border-radius:9px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink2)}
  .tb-nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink)}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:27px}.lede{font-size:15px}
}
@media (max-width:560px){
  .grid4{gap:12px}.stat{padding:14px;gap:10px;flex-direction:column}.stat .v{font-size:26px}
  .hero{padding:30px 22px;border-radius:18px}.hero p{font-size:16px}.chartcard{padding:16px 14px 10px}
  .rrow{grid-template-columns:62px minmax(0,1fr) auto}.rrow .ago{grid-column:2 / 4}.rrow img{width:62px;height:36px}
  .ph{grid-template-columns:repeat(2,1fr)}.rigcols .pad{padding:16px}.readout{grid-template-columns:1fr 1fr}.readout div:nth-child(2){border-right:0}.readout div:nth-child(n+3){border-top:1px solid var(--line)}
  .keys{display:none}.live{aspect-ratio:4/3}.meta div{padding:12px 16px}.dh,.db{padding-left:16px;padding-right:16px}
}
</style>

function rank(a){const idx=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]);const r=Array(a.length);let i=0;while(i<idx.length){let j=i;while(j+1<idx.length&&idx[j+1][0]===idx[i][0])j++;const m=(i+j)/2+1;for(let k=i;k<=j;k++)r[idx[k][1]]=m;i=j+1}return r}
function spearman(x,y){const a=rank(x),b=rank(y),n=a.length,ma=a.reduce((s,v)=>s+v,0)/n,mb=b.reduce((s,v)=>s+v,0)/n;let sab=0,sa=0,sb=0;for(let i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);sa+=(a[i]-ma)**2;sb+=(b[i]-mb)**2}return sab/Math.sqrt(sa*sb)}

const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.classList.add('on');const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+18;tip.style.left=x+'px';tip.style.top=y+'px'}
const hideTip=()=>tip.classList.remove('on');
function swarm(vals,xc,r,ym,maxOff){const placed=[];vals.slice().sort((a,b)=>a.v-b.v).forEach(p=>{const y=ym(p.v);let off=0;for(let i=0;i<60;i++){const o=i===0?0:(i%2?1:-1)*Math.ceil(i/2)*r*.8;if(Math.abs(o)>maxOff){off=(i%2?1:-1)*((i*7)%Math.round(maxOff));break}if(placed.every(q=>Math.hypot(q.x-(xc+o),q.y-y)>=2*r+.5)){off=o;break}}placed.push({x:xc+off,y,p})});return placed}
function frame(w,h,m,ymax,step,ylab){
 const iw=w-m.l-m.r,ih=h-m.t-m.b,Y=v=>m.t+ih-(v/ymax)*ih;let s='';
 for(let v=0;v<=ymax+1e-9;v+=step){s+=`<line class="gd" x1="${m.l}" x2="${w-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l-10}" y="${Y(v)+4}" text-anchor="end">${+v.toFixed(1)}</text>`}
 if(ylab)s+=`<text class="axs" transform="translate(14 ${m.t+ih/2}) rotate(-90)" text-anchor="middle">${ylab}</text>`;
 return {s,Y,iw,ih};
}
function drawStrip(el,pts,opt){
 const w=Math.max(280,el.clientWidth),h=w<520?320:380,m={l:w<520?46:62,r:10,t:14,b:46},ymax=opt.ymax,f=frame(w,h,m,ymax,opt.step,'Measured CI area (% of peel)');
 const band=f.iw/4;let s=f.s;
 (opt.bounds||[]).forEach(b=>{if(b<=ymax)s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${f.Y(b)}" y2="${f.Y(b)}" stroke="var(--bound)" stroke-width="1.2" stroke-dasharray="5 4"/>`});
 const r=w<520?3.6:4.4;
 for(let c=0;c<4;c++){
  const xc=m.l+band*(c+.5),g=pts.filter(p=>p.c===c);
  const series=opt.split?[['Initial',-1],['Pre',1]]:[[null,0]];
  series.forEach(([sk,sh])=>{
   const gg=sk?g.filter(p=>(p.b==='Initial')===(sk==='Initial')):g;
   const cx=xc+sh*band*.2;
   const pl=swarm(gg.map(p=>({v:p.ci,p})),cx,r,f.Y,band*(opt.split?.16:.36));
   pl.forEach(q=>{const fill=opt.split?(sk==='Initial'?'#1f65b3':'var(--c2)'):`var(--c${c})`;s+=`<circle class="pt" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${r}" style="fill:${fill}" data-id="${esc(q.p.p.id||'')}" data-c="${c}" data-v="${q.p.v}" data-t="${q.p.p.t||''}"/>`});
   const md=med(gg.map(p=>p.ci));if(md!=null)s+=`<line x1="${cx-band*(opt.split?.2:.28)}" x2="${cx+band*(opt.split?.2:.28)}" y1="${f.Y(md)}" y2="${f.Y(md)}" stroke="var(--median)" stroke-width="3" stroke-linecap="round"/>`;
  });
  s+=`<text class="axl" x="${xc}" y="${h-m.b+20}" text-anchor="middle">Class ${c}</text><text class="axs" x="${xc}" y="${h-m.b+36}" text-anchor="middle">n = ${g.length}</text>`;
 }
 el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opt.label)}" height="${h}">${s}</svg>`;
}
function drawRank(el,arr,opt){
 const w=Math.max(280,el.clientWidth),h=w<520?280:340,m={l:w<520?46:62,r:10,t:12,b:34},f=frame(w,h,m,opt.ymax,opt.step,'Measured CI area (% of peel)');
 const n=arr.length,bw=f.iw/n,gap=n>60?Math.min(.8,bw*.2):Math.min(10,bw*.28);let s=f.s;
 arr.forEach((a,i)=>{const bh=Math.max(1,(a.ci/opt.ymax)*f.ih);s+=`<rect class="bar-r fc${a.c}" x="${(m.l+i*bw+gap/2).toFixed(2)}" y="${(m.t+f.ih-bh).toFixed(2)}" width="${Math.max(1,bw-gap).toFixed(2)}" height="${bh.toFixed(2)}" data-id="${esc(a.id)}" data-c="${a.c}" data-v="${a.ci}" ${n>60?'':'rx="3"'}/>`});
 s+=`<text class="axs" x="${m.l+f.iw/2}" y="${h-6}" text-anchor="middle">Fruit, ranked from least to most affected</text>`;
 el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opt.label)}" height="${h}">${s}</svg>`;
}
function drawGrouped(el,groups,series,opt){
 const w=Math.max(280,el.clientWidth),h=w<520?300:340,m={l:w<520?46:62,r:10,t:12,b:40},f=frame(w,h,m,opt.ymax,opt.step,opt.ylab);
 const band=f.iw/groups.length,k=series.length,bw=Math.min(34,band*.78/k),inner=bw*k+2*(k-1);let s=f.s;
 groups.forEach((g,gi)=>{const x0=m.l+band*gi+(band-inner)/2;
  series.forEach((se,si)=>{const v=se.v[gi],bh=(v/opt.ymax)*f.ih,x=x0+si*(bw+2);
   s+=`<rect x="${x.toFixed(1)}" y="${(m.t+f.ih-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${se.col}" class="bar-r" data-tip="${esc(se.name)} · ${esc(g)}|${v}${opt.unit||''}"/>`});
  s+=`<text class="axl" x="${m.l+band*(gi+.5)}" y="${h-m.b+22}" text-anchor="middle">${g}</text>`});
 el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opt.label)}" height="${h}">${s}</svg>`;
}
function drawConv(el){
 const w=Math.max(280,el.clientWidth),h=w<520?280:330,m={l:w<520?46:62,r:16,t:14,b:46},ymax=5,f=frame(w,h,m,ymax,1,'Deviation (pp)');
 const X=v=>m.l+(v/50)*f.iw;let s=f.s;
 for(let v=0;v<=50;v+=10)s+=`<text class="ax" x="${X(v)}" y="${h-m.b+20}" text-anchor="middle">${v}</text>`;
 s+=`<text class="axs" x="${m.l+f.iw/2}" y="${h-8}" text-anchor="middle">Photographs used</text>`;
 const pts=CONV.map(([x,y])=>[X(x),f.Y(y)]);
 s+=`<path d="M${pts[0][0]} ${f.Y(0)} L${pts.map(p=>p.join(' ')).join(' L')} L${pts[pts.length-1][0]} ${f.Y(0)}Z" fill="var(--blue-soft)" opacity=".85"/><path d="M${pts.map(p=>p.join(' ')).join(' L')}" fill="none" stroke="#1f65b3" stroke-width="2.4" stroke-linejoin="round"/>`;
 CONV.forEach(([x,y],i)=>{s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="5" fill="#1f65b3" stroke="var(--surface)" stroke-width="2" class="bar-r" data-tip="${x} photograph${x>1?'s':''}|${y.toFixed(2)} pp from the 50-view result"/>`});
 el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Line chart: deviation from the fifty-view result falls from about 3.8 points with one photograph to about 0.1 with forty-eight" height="${h}">${s}</svg>`;
}
function tipFor(t){
 if(t.dataset.tip){const [a,b]=t.dataset.tip.split('|');return `<b style="font-family:var(--font)">${a}</b>${b}`}
 if(t.dataset.id){const has=!!(PHOTOS[t.dataset.id]);return `<b>${t.dataset.id}</b>Class ${t.dataset.c} · ${(+t.dataset.v).toFixed(2)} % of peel${/Batch\d_fruit/.test(t.dataset.id)||!t.dataset.id?'':' · click for photos'}`}

  $('#lgBal').innerHTML=LIVE.batches.map((b,i)=>`<span><i style="background:${cols[i]}"></i>${b.id}</span>`).join('');
  const ser=LIVE.batches.map((b,i)=>({name:b.id,col:cols[i],v:[0,1,2,3].map(c=>b.fruit.filter(f=>f.c===c).length)}));
  draws.push(()=>drawGrouped($('#chBal'),['Class 0','Class 1','Class 2','Class 3'],ser,{ymax:9,step:2,ylab:'Labelled fruit',unit:' fruit',label:'Labelled fruit per class for each batch. All labelled fruit so far are class 0.'}));
 }
 draws.forEach(d=>d());
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>draws.forEach(d=>d()),120)});
function render(){
 const pg={overview:pgOverview,capture:pgCapture,batches:pgBatches,analysis:pgAnalysis,previous:pgPrevious,rig:pgRig}[S.route]();
 const y=window.scrollY;$('#app').innerHTML=shell(pg);afterRender();
 const tbn=$('.tb-nav [aria-current]');if(tbn&&tbn.scrollIntoView)try{tbn.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
 if(document.activeElement===document.body)window.scrollTo(0,y);
}
document.addEventListener('click',e=>{
 const t=e.target;const q=s=>t.closest&&t.closest(s);let x;
 if(x=q('[data-go]')){go(x.dataset.go);return}
 if(q('#themeBtn')){const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',dark?'light':'dark');draws.forEach(d=>d());return}
 if(q('[data-lbx]')||(q('[data-lbbg]')&&!q('img')&&!q('[data-lbn]'))){const l=$('#lbRoot');if(l)l.remove();LB=null;return}
 if(x=q('[data-lbn]')){LB.i=(LB.i+ +x.dataset.lbn+LB.list.length)%LB.list.length;drawLB();return}
 if(x=q('[data-lb]')){const [st,i]=x.dataset.lb.split(':');openLB(st,+i);return}
 if(q('[data-close]')){closeDrawer();return}
 if(q('[data-dx]')||t.classList.contains('dlg')){const d=$('#dlgRoot');if(d)d.remove();return}
 if(q('#dlgCopy')){const ta=$('#dlgTxt');const done=()=>toast('Copied to the clipboard');(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value).then(done):Promise.reject()).catch(()=>{ta.select();try{document.execCommand('copy')?done():toast('Press Ctrl+C to copy the selected text')}catch(er){toast('Press Ctrl+C to copy the selected text')}});return}
 if(x=q('[data-export]')){exportDlg(x.dataset.export);return}
 if(x=q('[data-open]')){openFruit(x.dataset.open);return}
 if((x=q('circle.pt[data-id]'))||(x=q('rect.bar-r[data-id]'))){if(x.dataset.id&&!/^Batch\d_/.test(x.dataset.id))openFruit(x.dataset.id);return}
 if(x=q('[data-sort]')){const k=x.dataset.sort;if(S.sortK===k)S.sortD*=-1;else{S.sortK=k;S.sortD=(k==='id'||k==='batch'||k==='role')?1:-1}renderTable();return}
 if(x=q('[data-batch]')){S.batch=x.dataset.batch;S.filter='all';S.q='';render();return}
 if(x=q('[data-filter]')){S.filter=x.dataset.filter;render();return}
 if(x=q('[data-cls]')){const c=+x.dataset.cls;S.cls=S.cls===c?null:c;render();return}
 if(x=q('[data-feed]')){S.feed=x.dataset.feed;render();return}
 if(x=q('[data-tog]')){S[x.dataset.tog]=!S[x.dataset.tog];render();return}
 if(q('#startBtn')){startRun();return}
 if(q('#stopBtn')){stopRun();return}
 if(q('#discBtn')){discardLast();return}
 if(q('#ejectNow')){toast('Eject command sent (simulated)');return}
 if(q('#addBatch')){const n=LIVE.batches.length+1;LIVE.batches.unshift({id:'Batch'+n,name:'Midnight valencia',trial:'',ago:0,next:1,fruit:[]});S.batch='Batch'+n;toast('Batch'+n+' created');render();return}
 if(q('#measureBtn')){S.exposure.busy=true;render();setTimeout(()=>{const d=new Date();S.exposure={busy:false,when:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};if(S.route==='rig')render();toast('Exposure measured (simulated)')},2200);return}
 if(q('#bgBtn')){S.bg.busy=true;render();setTimeout(()=>{S.bg.busy=false;if(S.route==='rig')render();toast('Background plates shot (simulated)')},2200);return}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='batchSel'){S.batch=t.value;S.run=null;render();return}
 if(t.dataset&&t.dataset.lab){const f=allLive().find(x=>x.id===t.dataset.lab);const real=LIVE.batches.flatMap(b=>b.fruit).find(x=>x.id===t.dataset.lab);real.c=t.value===''?null:+t.value;toast('Label saved for '+real.id);render()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='nFrames')S.frames=t.value;if(t.id==='dia')S.dia=t.value;if(t.id==='notes')S.notes=t.value;
 if(t.id==='bq'){S.q=t.value;const p=t.selectionStart;render();const n=$('#bq');n.focus();n.setSelectionRange(p,p)}
 if(t.id==='tq'){S.tq=t.value;renderTable()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#lbRoot')){$('#lbRoot').remove();LB=null;return}if($('#dlgRoot')){$('#dlgRoot').remove();return}if(DR){closeDrawer();return}if(S.route==='capture'){stopRun()}return}
 if($('#lbRoot')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){LB.i=(LB.i+(e.key==='ArrowRight'?1:-1)+LB.list.length)%LB.list.length;drawLB();return}
 const tag=(e.target.tagName||'').toLowerCase();
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.open){openFruit(e.target.dataset.open);return}
 if(tag==='input'||tag==='select'||tag==='textarea'||DR)return;
 if(S.route==='capture'){
  if(e.key===' '){e.preventDefault();startRun()}
  else if('0123'.includes(e.key)&&e.key!==''){S.cls=S.cls===+e.key?null:+e.key;render()}
 }
});
(function init(){
 const h=(location.hash||'').replace('#','');if(ROUTES.some(r=>r[0]===h))S.route=h;
 render();
})();
</script>

</html>
